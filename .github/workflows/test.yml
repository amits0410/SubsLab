name: test

on:
  push:
  pull_request:

jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, macos-15]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest
        env:
          QT_QPA_PLATFORM: offscreen
