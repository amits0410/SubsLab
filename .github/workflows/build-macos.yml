name: Build SubsLab macOS DMG

on:
  workflow_dispatch:
  push:
    branches: ["codex/subslab-studio-refresh"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mac-ai,test,build]'
      - name: Test
        run: python -m pytest
      - name: Build and verify Apple Silicon disk image
        run: bash scripts/build_macos.sh
      - name: Smoke-test packaged application
        run: python scripts/smoke_app.py dist/SubsLab.app/Contents/MacOS/SubsLab
      - uses: actions/upload-artifact@v4
        with:
          name: SubsLab-macOS-arm64
          path: |
            dist/SubsLab.dmg
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7
