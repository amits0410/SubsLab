name: Release SubsLab for macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-macos.yml

permissions:
  contents: read

concurrency:
  group: subslab-macos-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mac-ai,test,build]'
      - name: Read application version
        id: version
        run: |
          version="$(python -c 'from subsgen.branding import APP_VERSION; print(APP_VERSION)')"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run complete test suite
        run: python -m pytest
      - name: Build and verify Apple Silicon disk image
        run: bash scripts/build_macos.sh
      - name: Verify DMG installation and startup after ejecting the disk image
        run: python scripts/smoke_macos_dmg.py dist/SubsLab.dmg
      - name: Prepare clearly named Mac downloads
        run: |
          cp dist/SubsLab.dmg dist/SubsLab-macOS-AppleSilicon.dmg
          cp docs/MACOS_INSTALLATION.txt dist/MACOS-INSTALLATION.txt
          (cd dist && shasum -a 256 SubsLab-macOS-AppleSilicon.dmg > SHA256SUMS-macOS.txt)
      - name: Preserve verified Mac release
        uses: actions/upload-artifact@v4
        with:
          name: SubsLab-macOS-AppleSilicon-${{ steps.version.outputs.version }}
          path: |
            dist/SubsLab-macOS-AppleSilicon.dmg
            dist/SHA256SUMS-macOS.txt
            dist/MACOS-INSTALLATION.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SubsLab-macOS-AppleSilicon-${{ needs.build.outputs.version }}
          path: release
      - name: Verify downloaded DMG checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS-macOS.txt
      - name: Add Mac downloads to the matching public release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "Publish the Windows release $tag first, then run this workflow again."
            exit 1
          fi
          gh release upload "$tag" \
            release/SubsLab-macOS-AppleSilicon.dmg \
            release/SHA256SUMS-macOS.txt \
            release/MACOS-INSTALLATION.txt
          gh release edit "$tag" \
            --title "SubsLab ${RELEASE_VERSION} - Windows and macOS" \
            --notes-file docs/RELEASE_NOTES.md
