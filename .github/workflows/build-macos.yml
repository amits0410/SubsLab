name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[mac-ai,test,build]'

      - name: Run tests
        run: python -m pytest

      - name: Build unsigned DMG
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh
          shasum -a 256 dist/SubsGen-Studio.dmg > dist/SHA256.txt

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: SubsGen-Studio-macOS-arm64
          path: |
            dist/SubsGen-Studio.dmg
            dist/SHA256.txt
          retention-days: 7
