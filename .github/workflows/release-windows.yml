name: Release SubsLab for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-windows.yml

permissions:
  contents: read

concurrency:
  group: subslab-windows-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[windows-ai,test,build]"
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $version = python -c "from subsgen.branding import APP_VERSION; print(APP_VERSION)"
          if ($LASTEXITCODE -ne 0 -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw 'Cannot determine the application release version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run complete test suite
        run: python -m pytest
      - name: Locate or install Inno Setup
        shell: pwsh
        run: |
          $innoDirectory = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
          if (-not (Test-Path -LiteralPath (Join-Path $innoDirectory 'ISCC.exe'))) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          }
          if (-not (Test-Path -LiteralPath (Join-Path $innoDirectory 'ISCC.exe'))) {
            throw 'Inno Setup compiler is unavailable.'
          }
          $innoDirectory >> $env:GITHUB_PATH
      - name: Build Windows app and installer
        shell: pwsh
        run: ./scripts/build.ps1 -Installer
      - name: Smoke-test packaged application
        run: python scripts/smoke_app.py dist/SubsLab/SubsLab.exe --seconds 8
      - name: Verify installation, installed app startup, and uninstallation
        shell: pwsh
        run: ./scripts/smoke_windows_installer.ps1 -InstallerPath dist/SubsLab-Setup.exe
      - name: Calculate installer checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath dist/SubsLab-Setup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SubsLab-Setup.exe" | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding ascii
      - name: Preserve verified installer
        uses: actions/upload-artifact@v4
        with:
          name: SubsLab-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/SubsLab-Setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
      - name: Preserve installer diagnostic logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SubsLab-Windows-install-logs
          path: ${{ runner.temp }}/subslab-installer-*.log
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SubsLab-Windows-${{ needs.build.outputs.version }}
          path: release
      - name: Verify downloaded installer checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Publish Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Published installers are not overwritten; increment APP_VERSION for a new release."
            exit 1
          fi
          gh release create "$tag" \
            release/SubsLab-Setup.exe release/SHA256SUMS.txt \
            --target "$RELEASE_COMMIT" \
            --title "SubsLab ${RELEASE_VERSION} for Windows" \
            --notes-file docs/RELEASE_NOTES.md \
            --latest
